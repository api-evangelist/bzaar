name: Bzaar
description: 'Bzaar is a cross-border business-to-business wholesale marketplace founded
  in 2020-2021 by Nishant Verman (previously head of corporate development at Flipkart)
  and Prasanth Nair (previously engineering and product at Amazon, Flipkart, and Lazada),
  headquartered in Palo Alto / San Francisco, California with operations in India.
  The platform connected small and medium retailers in the United States and other
  markets with curated suppliers and manufacturers in India and Southeast Asia, listing
  thousands of products across home, lifestyle, accessories, apparel, jewelry, cookware,
  and bakeware verticals, and layering sourcing services such as vendor management,
  quality control, consolidated logistics, and cross-border payments on top of the
  catalog. Bzaar raised a $4 million seed round led by Canaan Partners with participation
  from Binny Bansal, Sameer Nigam, Rahul Chari, Lee Fixel, and Ashish Gupta. As of
  this enrichment pass Bzaar publishes no public developer portal, API documentation,
  or machine-readable API surface, and its bzaar.com domain resolves to a registrar
  parking page rather than a live product site.'
